name: android-apk

# Сборка APK на бесплатных раннерах GitHub: публичный репозиторий → без лимитов.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Кэш Godot и шаблонов
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-templates-v1
      - name: Godot 4.7.2 + шаблоны экспорта
        run: |
          mkdir -p ~/godot && cd ~/godot
          if [ ! -x Godot_v4.7.2-stable_linux.x86_64 ]; then
            curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -o -q godot.zip && chmod +x Godot_v4.7.2-stable_linux.x86_64
          fi
          if [ ! -d ~/.local/share/godot/export_templates/4.7.2.stable ]; then
            curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/export_templates
            unzip -o -q templates.tpz -d /tmp/tpl
            mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.7.2.stable
          fi
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: Настройки редактора (пути к SDK и keystore)
        run: |
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore /tmp/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 > /dev/null 2>&1
          cat > ~/.config/godot/editor_settings-4.tres <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          EOS
      - name: Импорт ресурсов
        run: ~/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
      - name: Экспорт APK
        run: |
          mkdir -p build
          ~/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hayhunter.apk
          ls -la build/
      - uses: actions/upload-artifact@v4
        with:
          name: hayhunter-apk
          path: build/hayhunter.apk
          retention-days: 30
